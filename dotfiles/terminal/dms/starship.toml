# dms — Dux: agent mark, the case file (path) in a Material pill, a quiet ❯.
add_newline = true
command_timeout = 300
format = """
[󰗹 ](bold fg:{{primary}})$directory$git_branch$git_status$cmd_duration
$character"""

[directory]
style = "bold fg:{{onPrimary}} bg:{{primary}}"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:{{onPrimary}} bg:{{primary}}"
format = "[](fg:{{primary}})[󰉖 $path]($style)[$read_only]($read_only_style)[](fg:{{primary}}) "

[git_branch]
symbol = "󰊢"
style = "fg:{{secondary}} bg:{{surfaceContainer}}"
format = "[](fg:{{surfaceContainer}})[$symbol $branch]($style)[](fg:{{surfaceContainer}}) "

[git_status]
style = "fg:{{tertiary}}"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2000
style = "fg:{{outline}}"
format = "[󰔟 $duration]($style) "

[character]
success_symbol = "[❯](bold fg:{{primary}})"
error_symbol = "[❯](bold fg:{{error}})"
vimcmd_symbol = "[❮](bold fg:{{tertiary}})"
