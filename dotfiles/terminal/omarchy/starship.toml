# omarchy (alt) — opinionated and square: bracketed path, Tokyo-Night blue and amber, a crown-less ❯.
add_newline = false
command_timeout = 200
palette = "tokyo"
format = "$directory$git_branch$git_status$cmd_duration$character"

[palettes.tokyo]
blue = "#7aa2f7"
amber = "#e0af68"
green = "#9ece6a"
muted = "#565f89"
alert = "#f7768e"

[directory]
style = "bold fg:blue"
truncation_length = 2
truncation_symbol = "…/"
read_only = " ■"
read_only_style = "fg:alert"
format = "[\\[](fg:muted)[$path]($style)[$read_only]($read_only_style)[\\]](fg:muted) "

[git_branch]
symbol = ""
style = "fg:amber"
format = "[$branch]($style) "

[git_status]
style = "fg:green"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2000
style = "fg:muted"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold fg:blue)"
error_symbol = "[❯](bold fg:alert)"
vimcmd_symbol = "[❮](bold fg:amber)"
