# noctalia — the night watch: a moon, the path, and the owl as the prompt.
add_newline = true
command_timeout = 300
format = """
[󰖔 ](fg:#fff59b)$directory$git_branch$git_status$cmd_duration
$character"""

[directory]
style = "bold fg:{{primary}}"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:{{error}}"
format = "[$path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = "⋆"
style = "fg:#fff59b"
format = "[ $symbol $branch]($style)"

[git_status]
style = "fg:{{tertiary}}"
format = "[( $all_status$ahead_behind)]($style)"

[cmd_duration]
min_time = 2000
style = "fg:{{outline}}"
format = "[ · $duration]($style)"

# the owl: awake, startled when a command fails, dozing in vi normal mode
[character]
success_symbol = "[{o,o}](bold fg:{{primary}})"
error_symbol = "[{O,O}](bold fg:{{error}})"
vimcmd_symbol = "[{-,-}](bold fg:{{tertiary}})"
