# xenon — lean: one line, the flame as the prompt (it burns red when a command fails).
add_newline = false
command_timeout = 200
format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "bold fg:{{primary}}"
truncation_length = 2
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:{{error}}"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "fg:{{secondary}}"
format = "[$branch]($style) "

[git_status]
style = "fg:{{tertiary}}"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 3000
style = "fg:#ff9500"
format = "[󰔟 $duration]($style) "

[character]
success_symbol = "[󰈸](bold fg:#ff9500)"
error_symbol = "[󰈸](bold fg:#ff3d1f)"
vimcmd_symbol = "[󰈸](bold fg:#ffd000)"
