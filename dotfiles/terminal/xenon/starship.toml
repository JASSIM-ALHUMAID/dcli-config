# xenon — noble gas, lean: one line, xenon-lamp blue-white, nothing you don't need.
add_newline = false
command_timeout = 200
palette = "lamp"
format = "$directory$git_branch$git_status$cmd_duration$character"

[palettes.lamp]
glow = "#a5d8ff"
core = "#e7f5ff"
haze = "#5c7a99"
alert = "#ff8787"

[directory]
style = "fg:glow"
truncation_length = 2
truncation_symbol = "…/"
read_only = " ⌀"
read_only_style = "fg:alert"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "fg:core"
format = "[$branch]($style) "

[git_status]
style = "fg:haze"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 3000
style = "fg:haze"
format = "[$duration]($style) "

[character]
success_symbol = "[◆](bold fg:glow)"
error_symbol = "[◆](bold fg:alert)"
vimcmd_symbol = "[◇](bold fg:glow)"
