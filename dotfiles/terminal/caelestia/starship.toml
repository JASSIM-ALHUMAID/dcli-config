# caelestia (alt) — soft celestial glow: Material-lavender path, a rose star for git, ✧ to type on.
add_newline = true
command_timeout = 300
palette = "glow"
format = """
$directory$git_branch$git_status$cmd_duration
$character"""

[palettes.glow]
lavender = "#cdb4ff"
rose = "#ffb3d1"
sky = "#a8d8ff"
dim = "#7d7a99"
alert = "#ff9aa2"

[directory]
style = "bold fg:lavender"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:alert"
format = "[✧ ](fg:rose)[$path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = "󰊢"
style = "fg:rose"
format = "[ ∙ $symbol $branch]($style)"

[git_status]
style = "fg:sky"
format = "[ $all_status$ahead_behind]($style)"

[cmd_duration]
min_time = 2000
style = "fg:dim"
format = "[ ∙ $duration]($style)"

[character]
success_symbol = "[✧](bold fg:lavender)"
error_symbol = "[✧](bold fg:alert)"
vimcmd_symbol = "[✦](bold fg:rose)"
