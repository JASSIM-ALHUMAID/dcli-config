# ambxst — command deck: a two-line HUD frame, magenta + cyan on black.
add_newline = true
command_timeout = 300
palette = "deck"
format = """
[┌─](fg:frame)$directory$git_branch$git_status$cmd_duration
[└─](fg:frame)$character"""

[palettes.deck]
frame = "#6b3fa0"
magenta = "#e879f9"
cyan = "#22d3ee"
amber = "#fbbf24"
alert = "#fb7185"

[directory]
style = "bold fg:cyan"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:alert"
format = "[ ◈ ](fg:magenta)[$path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = ""
style = "fg:magenta"
format = "[ ┊ 󰊢 $branch]($style)"

[git_status]
style = "fg:amber"
format = "[ $all_status$ahead_behind]($style)"

[cmd_duration]
min_time = 2000
style = "fg:amber"
format = "[ ┊ 󰔚 $duration]($style)"

[character]
success_symbol = "[▸](bold fg:cyan)"
error_symbol = "[▸](bold fg:alert)"
vimcmd_symbol = "[◂](bold fg:magenta)"
