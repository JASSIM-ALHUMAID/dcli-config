# ambxst — the notch: one dark island (path · branch · clock), the blob's face below it.
add_newline = true
command_timeout = 300
format = """
[](fg:{{surfaceContainer}})$directory$git_branch$git_status$time[](fg:{{surfaceContainer}})
$character"""

[directory]
style = "bold fg:{{primary}} bg:{{surfaceContainer}}"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:{{error}} bg:{{surfaceContainer}}"
format = "[ $path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = "󰊢"
style = "fg:{{secondary}} bg:{{surfaceContainer}}"
format = "[  $symbol $branch]($style)"

[git_status]
style = "fg:{{tertiary}} bg:{{surfaceContainer}}"
format = "[( $all_status$ahead_behind)]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:{{outline}} bg:{{surfaceContainer}}"
format = "[  \U000f0150 $time ]($style)"

# the face: happy, puzzled on a failed command, asleep in vi normal mode
[character]
success_symbol = "[ •‿•](bold fg:{{primary}})"
error_symbol = "[ •_•](bold fg:{{error}})"
vimcmd_symbol = "[ -‿-](bold fg:{{tertiary}})"
