# end4 (alt) — Illogical Impulse: pastel pills and a lightning bolt, one jolt per prompt.
add_newline = true
command_timeout = 300
palette = "impulse"
format = """
$directory$git_branch$git_status$cmd_duration
$character"""

[palettes.impulse]
pill = "#2a2438"
violet = "#d0bcff"
mint = "#a8e6cf"
peach = "#ffcfa3"
alert = "#ffb4ab"

[directory]
style = "bold fg:violet bg:pill"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:alert bg:pill"
format = "[](fg:pill)[ $path]($style)[$read_only]($read_only_style)[](fg:pill) "

[git_branch]
symbol = "󰊢"
style = "bold fg:mint bg:pill"
format = "[](fg:pill)[$symbol $branch]($style)[](fg:pill) "

[git_status]
style = "fg:peach bg:pill"
format = "([](fg:pill)[$all_status$ahead_behind]($style)[](fg:pill) )"

[cmd_duration]
min_time = 2000
style = "fg:peach bg:pill"
format = "[](fg:pill)[󰔚 $duration]($style)[](fg:pill) "

[character]
success_symbol = "[⚡](bold fg:violet)"
error_symbol = "[⚡](bold fg:alert)"
vimcmd_symbol = "[⚡](bold fg:mint)"
