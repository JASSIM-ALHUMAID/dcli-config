# end4pc (alt) — the remix: a spinning record as the prompt, tertiary accent, a track-time readout.
add_newline = true
command_timeout = 300
format = """
[󰐊 ](fg:{{tertiary}})$directory$git_branch$git_status$cmd_duration
$character"""

[directory]
style = "bold fg:{{tertiary}}"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:{{error}}"
format = "[$path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = "󰎈"
style = "fg:{{primary}}"
format = "[  $symbol $branch]($style)"

[git_status]
style = "fg:{{secondary}}"
format = "[( $all_status$ahead_behind)]($style)"

[cmd_duration]
min_time = 2000
style = "fg:{{outline}}"
format = "[  ━━━● $duration]($style)"

[character]
success_symbol = "[󰀥](bold fg:{{tertiary}})"
error_symbol = "[󰀥](bold fg:{{error}})"
vimcmd_symbol = "[󰀥](bold fg:{{primary}})"
