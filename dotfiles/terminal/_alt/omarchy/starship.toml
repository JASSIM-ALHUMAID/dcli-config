# omarchy (alt) — brackets like the logo, joined like its maze.
add_newline = true
command_timeout = 200
format = '''
[┌\[](fg:{{outline}})$directory[\]](fg:{{outline}})$git_branch$git_status$cmd_duration
[└](fg:{{outline}})$character'''

[directory]
style = "bold fg:{{primary}}"
truncation_length = 2
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:{{error}}"
format = "[$path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = ""
style = "fg:{{secondary}}"
format = '[─\[](fg:{{outline}})[$branch]($style)[\]](fg:{{outline}})'

[git_status]
style = "fg:{{tertiary}}"
format = "([ $all_status$ahead_behind]($style))"

[cmd_duration]
min_time = 2000
style = "fg:{{outline}}"
format = '[─\[$duration\]]($style)'

[character]
success_symbol = '[─❯](bold fg:{{primary}})'
error_symbol = '[─❯](bold fg:{{error}})'
vimcmd_symbol = '[─❮](bold fg:{{tertiary}})'
