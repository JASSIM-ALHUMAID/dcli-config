# omarchy (alt-v2) — the omakase menu. Chef's choice, dotted leaders, no
# substitutions; the prompt is the order ticket.
add_newline = true
command_timeout = 200
format = """
[┌─](fg:{{outline}})[ OMAKASE ](bold fg:{{primary}})[ ─](fg:{{outline}})$directory$git_branch$git_status$fill$time[ ─┐](fg:{{outline}})
[└─](fg:{{outline}})[ CHEF'S CHOICE ](fg:{{tertiary}})$character """

[fill]
symbol = " "

[directory]
style = "bold fg:{{primary}}"
truncation_length = 2
truncation_symbol = "…/"
read_only = " ○"
read_only_style = "fg:{{error}}"
format = "[ $path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = "❖"
style = "fg:{{secondary}}"
format = "[  $symbol $branch]($style)"

[git_status]
style = "fg:{{tertiary}}"
format = "[( $all_status$ahead_behind)]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:{{outline}}"
format = "[$time ]($style)"

[cmd_duration]
min_time = 2000
style = "fg:{{outline}}"
format = "[course $duration]($style) "

[character]
success_symbol = "[◇](bold fg:{{primary}})"
error_symbol = "[✕](bold fg:{{error}})"
vimcmd_symbol = "[◈](bold fg:{{tertiary}})"
