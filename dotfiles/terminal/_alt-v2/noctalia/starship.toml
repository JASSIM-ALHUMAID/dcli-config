# noctalia — observatory logbook; the moon phase is computed from the local date.
# Layout: line 1 = identity · path · git ····· duration · time; line 2 = the prompt
# character. Right-hand edges are left open on purpose: a frame whose right side
# depends on variable-width modules misaligns.
add_newline = true
command_timeout = 300
format = """
[☾](fg:{{tertiary}}) ${custom.moon}[ │ ](fg:{{outline}})$directory$git_branch$git_status$fill$cmd_duration$time
[╰─](fg:{{outline}}) $character"""

[fill]
symbol = " "

[directory]
format = "[$path](bold fg:{{primary}})[$read_only](fg:{{error}})"
truncation_length = 3
truncation_symbol = "…/"
read_only = " ◐"

[git_branch]
symbol = "⋆"
style = "fg:{{secondary}}"
format = "[  $symbol $branch]($style)"

[git_status]
style = "fg:{{tertiary}}"
format = "[( $all_status$ahead_behind)]($style)"

[cmd_duration]
min_time = 2000
style = "fg:{{outline}}"
format = "[ ◌ $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:{{outline}}"
format = "[$time]($style)"

[character]
success_symbol = "[{o,o}](bold fg:{{primary}})"
error_symbol = "[{O,O}](bold fg:{{error}})"
vimcmd_symbol = "[{-,-}](bold fg:{{tertiary}})"

[custom.moon]
command = '''awk 'BEGIN { a=int(((systime()-947182440)/86400)%29.530588); if(a<1.85) print "new moon"; else if(a<7.38) print "waxing crescent"; else if(a<11.07) print "first quarter"; else if(a<14.77) print "waxing gibbous"; else if(a<18.46) print "full moon"; else if(a<22.15) print "waning gibbous"; else if(a<25.84) print "last quarter"; else print "waning crescent" }' '''
when = true
shell = ["sh"]
format = "[$output]($style)"
style = "fg:{{tertiary}}"
