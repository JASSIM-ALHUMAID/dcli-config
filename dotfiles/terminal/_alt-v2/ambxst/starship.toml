# ambxst (alt-v2) — AxLab boot console. The prompt is the site's `~ » Terminal ▏`
# line, with an OK block and a red cursor; command time is the boot counter.
add_newline = true
command_timeout = 300
format = """
[\\[ OK \\]](bold fg:{{primary}})[~ »](bold fg:{{error}}) $directory$git_branch$git_status$cmd_duration
$time $character"""


[directory]
style = "bold fg:{{primary}}"
truncation_length = 3
truncation_symbol = "…/"
read_only = " ▏"
read_only_style = "fg:{{error}}"
format = "[$path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = "⌥"
style = "fg:{{secondary}}"
format = "[  $symbol $branch]($style)"

[git_status]
style = "fg:{{tertiary}}"
format = "[( $all_status$ahead_behind)]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:{{outline}}"
format = "[$time ]($style)"

[cmd_duration]
min_time = 1000
style = "fg:{{outline}}"
format = "[BUILD $duration]($style) "

[character]
success_symbol = "[█](bold fg:{{primary}})"
error_symbol = "[█](bold fg:{{error}})"
vimcmd_symbol = "[▒](bold fg:{{tertiary}})"
