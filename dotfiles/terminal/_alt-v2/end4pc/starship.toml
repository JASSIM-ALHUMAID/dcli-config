# end4pc — a community preset card: chips for id and stars, a download meter.
# Layout: line 1 = identity · path · git ····· duration · time; line 2 = the prompt
# character. Right-hand edges are left open on purpose: a frame whose right side
# depends on variable-width modules misaligns.
add_newline = true
command_timeout = 300
format = """
[](fg:{{tertiary}})[ pC-001 ](bold fg:{{background}} bg:{{tertiary}})[](fg:{{tertiary}}) [ ★ 3.7k ](fg:{{primary}} bg:{{surfaceVariant}}) $directory$git_branch$git_status$fill$cmd_duration$time
[ INSTALL ](bold fg:{{onPrimary}} bg:{{primary}}) $character"""

[fill]
symbol = " "

[directory]
format = "[$path](bold fg:{{text}})[$read_only](fg:{{error}})"
truncation_length = 3
truncation_symbol = "…/"
read_only = " ✗"

[git_branch]
symbol = "#"
style = "fg:{{secondary}}"
format = "[  $symbol$branch]($style)"

[git_status]
style = "fg:{{tertiary}}"
format = "[( $all_status$ahead_behind)]($style)"

[cmd_duration]
min_time = 2000
style = "fg:{{primary}}"
format = "[ ↓ $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:{{outline}}"
format = "[$time]($style)"

[character]
success_symbol = "[↓](bold fg:{{primary}})"
error_symbol = "[✕](bold fg:{{error}})"
vimcmd_symbol = "[◌](bold fg:{{tertiary}})"
