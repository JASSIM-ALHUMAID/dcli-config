# end4 — an oscilloscope channel; the trace is drawn from the load average.
# Layout: line 1 = identity · path · git ····· duration · time; line 2 = the prompt
# character. Right-hand edges are left open on purpose: a frame whose right side
# depends on variable-width modules misaligns.
add_newline = true
command_timeout = 300
format = """
[ CH1 ](bold fg:{{onPrimary}} bg:{{primary}})[ ](fg:{{primary}})${custom.wave} $directory$git_branch$git_status$fill$cmd_duration$time
$character"""

[fill]
symbol = " "

[directory]
format = "[$path](bold fg:{{primary}})[$read_only](fg:{{error}})"
truncation_length = 3
truncation_symbol = "…/"
read_only = " ⊘"

[git_branch]
symbol = "∿"
style = "fg:{{secondary}}"
format = "[  $symbol $branch]($style)"

[git_status]
style = "fg:{{tertiary}}"
format = "[( $all_status$ahead_behind)]($style)"

[cmd_duration]
min_time = 2000
style = "fg:{{tertiary}}"
format = "[ LAT $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:{{outline}}"
format = "[$time]($style)"

[character]
success_symbol = "[●](bold fg:{{primary}}) "
error_symbol = "[✕](bold fg:{{error}}) "
vimcmd_symbol = "[◌](bold fg:{{tertiary}}) "

[custom.wave]
command = '''awk 'BEGIN{ split("▁ ▂ ▃ ▄ ▅ ▆ ▇ █",g," ") } { l=$1; for(i=0;i<10;i++){ v=int((sin(i/1.6+l)+1)*3.5); printf "%s", g[v+1] } }' /proc/loadavg'''
when = true
shell = ["sh"]
format = "[$output]($style)"
style = "fg:{{secondary}}"
