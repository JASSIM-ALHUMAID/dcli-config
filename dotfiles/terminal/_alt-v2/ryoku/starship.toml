# ryoku — a magazine masthead: the red 力 stamp is the sun, rules are the grid.
# Layout: line 1 = identity · path · git ····· duration · time; line 2 = the prompt
# character. Right-hand edges are left open on purpose: a frame whose right side
# depends on variable-width modules misaligns.
add_newline = true
command_timeout = 300
format = """
[力](bold fg:#f3ede1 bg:#e2342a)[ RYOKU ](bold fg:{{text}})[─](fg:{{secondary}}) $directory$git_branch$git_status$fill$cmd_duration$time
[ ](fg:#e2342a)$character"""

[fill]
symbol = " "

[directory]
format = "[$path](bold fg:{{text}})[$read_only](fg:{{error}})"
truncation_length = 3
truncation_symbol = "…/"
read_only = " ○"

[git_branch]
symbol = "·"
style = "fg:{{tertiary}}"
format = "[ $symbol $branch]($style)"

[git_status]
style = "fg:#e2342a"
format = "[( $all_status$ahead_behind)]($style)"

[cmd_duration]
min_time = 2000
style = "fg:{{secondary}}"
format = "[ — $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:{{secondary}}"
format = "[ISSUE 1.0 · $time]($style)"

[character]
success_symbol = "[◉](bold fg:#e2342a)"
error_symbol = "[◉](bold fg:{{error}})"
vimcmd_symbol = "[○](bold fg:{{secondary}})"
