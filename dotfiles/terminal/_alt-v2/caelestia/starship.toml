# caelestia (alt-v2) — a fluid identity: one aurora tank, the shell's own
# morphing surface. The header is the tank; the metrics are its density readout.
add_newline = true
command_timeout = 300
format = """
[╭─](fg:{{outline}})[✦](fg:{{tertiary}}) $directory$git_branch$git_status$fill$time[ ─╮](fg:{{outline}})
[│](fg:{{outline}}) [▁▂▃▄▅▆▇█▇▆▅▄▃▂▁](fg:{{secondary}})$fill$cmd_duration[ │](fg:{{outline}})
[╰─](fg:{{outline}})$character """

[fill]
symbol = " "

[directory]
style = "bold fg:{{primary}}"
truncation_length = 3
truncation_symbol = "…/"
read_only = " ◇"
read_only_style = "fg:{{error}}"
format = "[ $path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = "✦"
style = "fg:{{tertiary}}"
format = "[  $symbol $branch]($style)"

[git_status]
style = "fg:{{secondary}}"
format = "[( $all_status$ahead_behind)]($style)"

[cmd_duration]
min_time = 2000
style = "fg:{{outline}}"
format = "[◌ $duration]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "fg:{{outline}}"
format = "[$time ]($style)"

[character]
success_symbol = "[❯](bold fg:{{primary}})"
error_symbol = "[❯](bold fg:{{error}})"
vimcmd_symbol = "[◇](bold fg:{{tertiary}})"
