# caelestia — a morphing capsule: pill-shaped segments that melt into each other.
# Layout: line 1 = identity · path · git ····· duration · time; line 2 = the prompt
# character. Right-hand edges are left open on purpose: a frame whose right side
# depends on variable-width modules misaligns.
add_newline = true
command_timeout = 300
format = """
[](fg:{{primary}})[ ✦ ](bg:{{primary}} fg:{{onPrimary}})[](fg:{{primary}} bg:{{surfaceVariant}})$directory[](fg:{{surfaceVariant}})$git_branch$git_status$fill$cmd_duration$time
$character """

[fill]
symbol = " "

[directory]
format = "[ $path ](bold fg:{{text}} bg:{{surfaceVariant}})[$read_only](fg:{{error}} bg:{{surfaceVariant}})"
truncation_length = 3
truncation_symbol = "…/"
read_only = " ◇"

[git_branch]
symbol = "✦"
style = "fg:{{tertiary}}"
format = "[ $symbol $branch]($style)"

[git_status]
style = "fg:{{secondary}}"
format = "[( $all_status$ahead_behind)]($style)"

[cmd_duration]
min_time = 2000
style = "fg:{{outline}}"
format = "[◌ $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:{{outline}}"
format = "[$time]($style)"

[character]
success_symbol = "[❯](bold fg:{{primary}})"
error_symbol = "[❯](bold fg:{{error}})"
vimcmd_symbol = "[◇](bold fg:{{tertiary}})"
