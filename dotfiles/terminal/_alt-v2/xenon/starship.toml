# xenon — flight control: afterburner ramp on the left, Mach-style duration.
# Layout: line 1 = identity · path · git ····· duration · time; line 2 = the prompt
# character. Right-hand edges are left open on purpose: a frame whose right side
# depends on variable-width modules misaligns.
add_newline = true
command_timeout = 300
format = """
[󰈸 XENON ](bold fg:{{background}} bg:{{primary}})[](fg:{{primary}} bg:{{secondary}})[](fg:{{secondary}})[ ](fg:{{secondary}}) $directory$git_branch$git_status$fill$cmd_duration$time
$character"""

[fill]
symbol = " "

[directory]
format = "[$path](bold fg:{{primary}})[$read_only](fg:{{error}})"
truncation_length = 2
truncation_symbol = "…/"
read_only = " ◇"

[git_branch]
symbol = "⌁"
style = "fg:{{secondary}}"
format = "[  $symbol $branch]($style)"

[git_status]
style = "fg:{{tertiary}}"
format = "[( $all_status$ahead_behind)]($style)"

[cmd_duration]
min_time = 3000
style = "fg:{{tertiary}}"
format = "[ MACH $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:{{outline}}"
format = "[T+$time]($style)"

[character]
success_symbol = "[󰈸](bold fg:{{primary}}) "
error_symbol = "[󰈸](bold fg:{{error}}) "
vimcmd_symbol = "[󰈸](bold fg:{{tertiary}}) "
