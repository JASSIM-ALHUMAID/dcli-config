# The caelestia fork installs its QML plugin to ~/.local/lib/qt6/qml, but the
# packaged caelestia-shell also ships one in /usr/lib/qt6/qml. Only /usr/lib is
# on Qt's default import path, so without this the older packaged module wins
# and the shell dies with "LogindManager is not a type".
#
# This lives here rather than in hyprland's `env` (only applied at compositor
# startup, and only when caelestia is the active shell) or ~/.config/uwsm/env
# (a symlink into the upstream caelestia-dots clone, overwritten on update).
# uwsm runs the compositor as a systemd user unit, so environment.d covers the
# whole session — terminals included.
QML2_IMPORT_PATH=/home/awhss/.local/lib/qt6/qml
CAELESTIA_LIB_DIR=/home/awhss/.local/lib/caelestia
