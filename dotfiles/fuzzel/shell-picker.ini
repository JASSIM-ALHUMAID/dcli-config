# Dedicated fuzzel config for the shell-switcher picker (switch-shell.sh).
# Loaded with `fuzzel --config`, which bypasses fuzzel.ini entirely, so this
# file is self-contained. Colors come from the theme file the active shell
# generates, keeping the picker in sync with the rest of the desktop.
include=~/.config/fuzzel/fuzzel_theme.ini

font=JetBrains Mono NF:size=18
dpi-aware=no
layer=overlay
keyboard-focus=exclusive

prompt="  "
placeholder=Switch shell…
match-counter=no
icons-enabled=yes

# One row per shell in KNOWN (switch-shell.sh) — bump this when adding a shell,
# or fuzzel scrolls the overflow with no on-screen indicator.
lines=7
width=48
line-height=34
inner-pad=18
horizontal-pad=30
vertical-pad=22

[border]
radius=18
width=3
selection-radius=10
