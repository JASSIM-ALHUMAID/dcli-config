# matugen config owned by the ml4w shell (shell-ml4w.yaml).
#
# Vendored from mylinuxforwork/dotfiles dotfiles/.config/matugen/config.toml so
# the ml4w shell never depends on ~/.config/matugen, which is a symlink into
# ~/.local/share/dots-hyprland (owned by shell-end4) — the same lesson as
# matugen-end4pc.
#
# colors.json drives the shell itself: CustomTheme/Theme.qml reads
# ~/.config/ml4w/colors/colors.json on `qs -c ml4w ipc call theme-manager reload`.
# colors.rasi themes the rofi launcher, which ml4w's config.rasi pulls in with
# `@theme "~/.config/rofi/colors.rasi"`.
# Run it as: matugen -c ~/.config/matugen-ml4w/config.toml image <wallpaper> --source-color-index 0

[config]
version_check = false

[templates.colorsjson]
input_path = '~/.config/matugen-ml4w/templates/colors.json'
output_path = '~/.config/ml4w/colors/colors.json'

# The launcher. ~/.config/rofi is a seeded REAL dir (not a symlink into the
# checkout) precisely so this write lands outside git — see setup-ml4w.sh.
[templates.rofi]
input_path = '~/.config/matugen-ml4w/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

# The workspace overview, which reads its palette from a generated QML file
# rather than JSON. Upstream writes this to ~/.config/quickshell/overview/...,
# but ours would land inside ~/.config/quickshell/ml4w -> the git checkout, and
# Appearance.colors.qml is a TRACKED file there — every wallpaper change would
# dirty the tree and break update-ml4w.sh's `git pull --ff-only`. So the
# overview runs from a seeded copy at ~/.config/ml4w-overview instead.
[templates.quickshell_overview]
input_path = '~/.config/matugen-ml4w/templates/quickshell-overview.qml'
output_path = '~/.config/ml4w-overview/common/Appearance.colors.qml'
