# House hyprlock config.
#
# ~/.config/hypr is shared by every shell, so this is the lock screen any shell
# gets when it falls back to a bare `hyprlock` — ml4w (SUPER+L runs
# ml4w-power -l, which is `pidof hyprlock || hyprlock`) and end4/end4-pC when
# their shell option lock.useHyprlock is turned on. hyprlock searches XDG paths
# only ("Searched in order: XDG_CONFIG_HOME, HOME, XDG_CONFIG_DIRS, /etc/xdg");
# there is no /usr/share/hypr fallback, so without this file those shells fail
# to lock at all.
#
# Colours and $background_image come from hyprlock/colors.conf, which
# matugen-end4pc regenerates on every wallpaper change (its template lives at
# matugen-end4pc/templates/hyprland/hyprlock-colors.conf). Shells whose matugen
# config ships no hyprlock template — ml4w — simply reuse whatever was written
# there last, so the lock screen is always themed, just not always to the
# wallpaper of the moment.

source = ~/.config/hypr/hyprlock/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $background_image
    blur_passes = 2
    blur_size = 8
    brightness = 0.7
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 26
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    font_family = $font_family
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text_color
    font_size = 92
    font_family = $font_family_clock
    position = 0, 60
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $text_color
    font_size = 20
    font_family = $font_family
    position = 0, -10
    halign = center
    valign = center
}
