# Caelestia — my custom fork (full hyprland config ships with caelestia)
# GPU (Lucienne/VCN2) has no AV1 hwdec and Qt's FFmpeg backend won't fall back
# to software on its own — force software decode for shell video wallpapers.
env = QT_FFMPEG_DECODING_HW_DEVICE_TYPES,none
source = ~/.local/share/caelestia/hypr/hyprland.conf
