# Noctalia — no hyprland config of its own, so reuse caelestia's base
# (env, input, animations, monitors, and my hypr-user.conf app binds).
# Caelestia-IPC keybinds in that base are harmless no-ops while caelestia
# isn't running.
source = ~/.local/share/caelestia/hypr/hyprland.conf

# Noctalia itself (package: noctalia-shell, config name: noctalia-shell)
exec-once = qs -c noctalia-shell

# Noctalia equivalents for the shell-IPC binds that go dead without caelestia
bind = Super, Space, exec, qs -c noctalia-shell ipc call launcher toggle
bind = Super+Alt, L, exec, qs -c noctalia-shell ipc call lockScreen toggle
