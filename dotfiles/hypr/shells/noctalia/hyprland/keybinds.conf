# --- Shell keybinds (Noctalia IPC) ---
# tap Super alone = launcher; must be bindr (fires on key RELEASE and is
# suppressed when Super was used as a modifier — a plain bind fires the
# launcher on press, i.e. at the start of every Super+X combo)
bindr = Super, Super_L, exec, $noctaliaCmd launcher toggle
bind = Super, D, exec, $noctaliaCmd controlCenter toggle
bind = Super, N, exec, $noctaliaCmd notifications toggleHistory
bind = Super, I, exec, $noctaliaCmd settings toggle
bind = Super, l, exec, $noctaliaCmd lockScreen toggle
bind = Super+Shift, w, exec, $noctaliaCmd wallpaper random

# --- Core WM binds ---
bind = Super, Q, killactive
bind = Super, F, fullscreen
bind = Super+Alt, F, togglefloating

bind = Super, left, movefocus, l
bind = Super, right, movefocus, r
bind = Super, up, movefocus, u
bind = Super, down, movefocus, d

bind = Super+Shift, left, movewindow, l
bind = Super+Shift, right, movewindow, r
bind = Super+Shift, up, movewindow, u
bind = Super+Shift, down, movewindow, d

bind = Super+Alt, period, layoutmsg, move +col
bind = Super+Alt, comma, layoutmsg, move -col
bind = Super+Shift, period, layoutmsg, colresize +conf
bind = Super+Shift, comma, layoutmsg, colresize -conf

bind = Super, 1, workspace, 1
bind = Super, 2, workspace, 2
bind = Super, 3, workspace, 3
bind = Super, 4, workspace, 4
bind = Super, 5, workspace, 5
bind = Super+Shift, 1, movetoworkspace, 1
bind = Super+Shift, 2, movetoworkspace, 2
bind = Super+Shift, 3, movetoworkspace, 3
bind = Super+Shift, 4, movetoworkspace, 4
bind = Super+Shift, 5, movetoworkspace, 5
bind = Super, tab, workspace, m+1
bind = Super+Shift, tab, workspace, m-1

bindm = Super, mouse:272, movewindow
bindm = Super, mouse:273, resizewindow

# --- Media / hardware keys ---
bindl = , XF86AudioRaiseVolume, exec, $noctaliaCmd volume increase
bindl = , XF86AudioLowerVolume, exec, $noctaliaCmd volume decrease
bindl = , XF86AudioMute, exec, $noctaliaCmd volume muteOutput
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86MonBrightnessUp, exec, $noctaliaCmd brightness increase
bindl = , XF86MonBrightnessDown, exec, $noctaliaCmd brightness decrease

# --- Screenshots ---
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = Super+Shift, S, exec, grim -g "$(slurp)" - | swappy -f -

# --- Apps ---
bind = Super, w, exec, zen-browser
bind = Super, r, exec, $fileExplorer
bind = Super, b, exec, $browser
bind = Super, return, exec, $terminal
bind = Super+Alt, k, exec, kitty
bind = Ctrl+Alt, b, exec, blueman-manager
bind = Super, Backslash, exec, hyprsunset -t 4500
bind = Super+Shift, Backslash, exec, pkill hyprsunset

# --- Shell switcher ---
bind = Super+Shift, o, exec, ~/.config/dcli/scripts/switch-shell.sh
