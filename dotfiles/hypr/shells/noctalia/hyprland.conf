# ============================================================
# Noctalia — standalone hyprland config
# Fully independent: edit freely without affecting the other shells.
# Seeded from my caelestia/ambxst hypr-user.conf preferences.
# ============================================================

$noctalia = ~/.config/dcli/dotfiles/hypr/shells/noctalia

# Variables
source = $noctalia/variables.conf

# Default monitor conf
monitor = , preferred, auto, 1

# Configs
source = $noctalia/hyprland/env.conf
source = $noctalia/hyprland/general.conf
source = $noctalia/hyprland/input.conf
source = $noctalia/hyprland/scrolling.conf
source = $noctalia/hyprland/decoration.conf
source = $noctalia/hyprland/animations.conf
source = $noctalia/hyprland/execs.conf
source = $noctalia/hyprland/misc.conf
source = $noctalia/hyprland/rules.conf
source = $noctalia/hyprland/keybinds.conf
