# --- Shell keybinds (DMS IPC) ---
bind = Super, D, exec, $dmsCmd spotlight toggle
bind = Super, V, exec, $dmsCmd clipboard toggle
bind = Super, N, exec, $dmsCmd notifications toggle
bind = Super, I, exec, $dmsCmd settings toggle
bind = Super, Escape, exec, $dmsCmd powermenu toggle
bind = Super+Alt, L, exec, $dmsCmd lock lock
bind = Super+Shift, w, exec, $dmsCmd wallpaper next

# --- Core WM binds ---
bind = Super, Q, killactive
bind = Super, F, fullscreen
bind = Super+Alt, F, togglefloating

bind = Super, left, movefocus, l
bind = Super, right, movefocus, r
bind = Super, up, movefocus, u
bind = Super, down, movefocus, d

bind = Super+Shift, left, movewindow, l
bind = Super+Shift, right, movewindow, r
bind = Super+Shift, up, movewindow, u
bind = Super+Shift, down, movewindow, d

bind = Super+Alt, period, layoutmsg, move +col
bind = Super+Alt, comma, layoutmsg, move -col
bind = Super+Shift, period, layoutmsg, colresize +conf
bind = Super+Shift, comma, layoutmsg, colresize -conf

bind = Super, 1, workspace, 1
bind = Super, 2, workspace, 2
bind = Super, 3, workspace, 3
bind = Super, 4, workspace, 4
bind = Super, 5, workspace, 5
bind = Super+Alt, 1, movetoworkspace, 1
bind = Super+Alt, 2, movetoworkspace, 2
bind = Super+Alt, 3, movetoworkspace, 3
bind = Super+Alt, 4, movetoworkspace, 4
bind = Super+Alt, 5, movetoworkspace, 5
bind = Super, tab, workspace, m+1
bind = Super+Shift, tab, workspace, m-1
bind = Super, z, workspace, -1
bind = Super, x, workspace, +1

bindm = Super, mouse:272, movewindow
bindm = Super, mouse:273, resizewindow

# --- Media / hardware keys ---
bindl = , XF86AudioRaiseVolume, exec, $dmsCmd audio increment 5
bindl = , XF86AudioLowerVolume, exec, $dmsCmd audio decrement 5
bindl = , XF86AudioMute, exec, $dmsCmd audio mute
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86MonBrightnessUp, exec, $dmsCmd brightness increment 5
bindl = , XF86MonBrightnessDown, exec, $dmsCmd brightness decrement 5

# --- Screenshots ---
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = Super+Shift, S, exec, grim -g "$(slurp)" - | swappy -f -

# --- Apps ---
bind = Super, e, exec, thunar
bind = Super, b, exec, $browser
bind = Super, return, exec, $terminal
bind = Super+Alt, k, exec, kitty
bind = Ctrl+Alt, b, exec, blueman-manager
bind = Super, Backslash, exec, hyprsunset -t 4500
bind = Super+Shift, Backslash, exec, pkill hyprsunset

# --- Shell switcher ---
bind = Super+Shift, o, exec, ~/.config/dcli/scripts/switch-shell.sh
