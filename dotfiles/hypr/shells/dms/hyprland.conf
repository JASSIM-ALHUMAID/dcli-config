# ============================================================
# DankMaterialShell — standalone hyprland config
# Fully independent: edit freely without affecting the other shells.
# Seeded from my caelestia/ambxst hypr-user.conf preferences.
# ============================================================

$dms = ~/.config/dcli/dotfiles/hypr/shells/dms

# Variables
source = $dms/variables.conf

# Default monitor conf
monitor = , preferred, auto, 1

# Configs
source = $dms/hyprland/env.conf
source = $dms/hyprland/general.conf
source = $dms/hyprland/input.conf
source = $dms/hyprland/scrolling.conf
source = $dms/hyprland/decoration.conf
source = $dms/hyprland/animations.conf
source = $dms/hyprland/execs.conf
source = $dms/hyprland/misc.conf
source = $dms/hyprland/rules.conf
source = $dms/hyprland/keybinds.conf
