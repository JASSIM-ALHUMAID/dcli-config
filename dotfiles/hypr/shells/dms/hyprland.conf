# ============================================================
# DankMaterialShell — standalone hyprland config
# Fully independent: edit freely without affecting the other shells.
# Seeded from my caelestia/ambxst hypr-user.conf preferences.
# ============================================================

# --- shell -------------------------------------------------------------
exec-once = dms run

bind = Super, D, exec, dms ipc call spotlight toggle
bind = Super, V, exec, dms ipc call clipboard toggle
bind = Super, N, exec, dms ipc call notifications toggle
bind = Super, I, exec, dms ipc call settings toggle
bind = Super, Escape, exec, dms ipc call powermenu toggle
bind = Super+Alt, L, exec, dms ipc call lock lock
bind = Super+Shift, w, exec, dms ipc call wallpaper next

# --- monitors ----------------------------------------------------------
monitor = , preferred, auto, 1

# --- autostart (session basics) ----------------------------------------
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- input (my prefs) --------------------------------------------------
input {
    kb_layout = us,ara
    kb_variant = ,
    kb_options = grp:win_space_toggle, ctrl:nocaps
    sensitivity = 0.3
    accel_profile = flat
}

# --- layout / looks ----------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = scrolling
}

scrolling {
    column_width = 0.85
    explicit_column_widths = 0.35, 0.5, 0.65, 0.95, 1.0
}

decoration {
    rounding = 12
    blur {
        enabled = true
    }
}

animations {
    enabled = true
    animation = workspaces, 1, 5, default, slidevert
}

# --- core WM binds -----------------------------------------------------
bind = Super, Q, killactive
bind = Super, F, fullscreen
bind = Super+Alt, F, togglefloating

bind = Super, left, movefocus, l
bind = Super, right, movefocus, r
bind = Super, up, movefocus, u
bind = Super, down, movefocus, d

bind = Super+Shift, left, movewindow, l
bind = Super+Shift, right, movewindow, r
bind = Super+Shift, up, movewindow, u
bind = Super+Shift, down, movewindow, d

bind = Super+Alt, period, layoutmsg, move +col
bind = Super+Alt, comma, layoutmsg, move -col
bind = Super+Shift, period, layoutmsg, colresize +conf
bind = Super+Shift, comma, layoutmsg, colresize -conf

bind = Super, 1, workspace, 1
bind = Super, 2, workspace, 2
bind = Super, 3, workspace, 3
bind = Super, 4, workspace, 4
bind = Super, 5, workspace, 5
bind = Super+Shift, 1, movetoworkspace, 1
bind = Super+Shift, 2, movetoworkspace, 2
bind = Super+Shift, 3, movetoworkspace, 3
bind = Super+Shift, 4, movetoworkspace, 4
bind = Super+Shift, 5, movetoworkspace, 5
bind = Super, tab, workspace, m+1
bind = Super+Shift, tab, workspace, m-1

bindm = Super, mouse:272, movewindow
bindm = Super, mouse:273, resizewindow

# --- media / hardware keys ---------------------------------------------
bindl = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 5
bindl = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 5
bindl = , XF86AudioMute, exec, dms ipc call audio mute
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5
bindl = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5

# --- screenshots -------------------------------------------------------
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = Super+Shift, S, exec, grim -g "$(slurp)" - | swappy -f -

# --- apps (my binds) ---------------------------------------------------
bind = Super, b, exec, brave-browser-nightly
bind = Super, return, exec, wezterm-gui
bind = Super+Alt, k, exec, kitty
bind = Ctrl+Alt, b, exec, blueman-manager
bind = Super, Backslash, exec, hyprsunset -t 4500
bind = Super+Shift, Backslash, exec, pkill hyprsunset

# --- shell switcher (fuzzel picker) --------------------------------------
bind = Super+Shift, o, exec, ~/.config/dcli/scripts/switch-shell.sh
