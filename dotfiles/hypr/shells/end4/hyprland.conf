# ============================================================
# end-4 (illogical-impulse) — standalone hyprland config
# Fully independent: edit freely without affecting the other shells.
# Seeded from the noctalia standalone config; end-4's upstream lua
# hypr config intentionally not used (it assumes ~/.config/hypr ownership).
# ============================================================

$end4 = ~/.config/dcli/dotfiles/hypr/shells/end4

# Variables
source = $end4/variables.conf

# Default monitor conf
monitor = , preferred, auto, 1

# Configs
source = $end4/hyprland/env.conf
source = $end4/hyprland/general.conf
source = $end4/hyprland/input.conf
source = $end4/hyprland/scrolling.conf
source = $end4/hyprland/decoration.conf
source = $end4/hyprland/animations.conf
source = $end4/hyprland/execs.conf
source = $end4/hyprland/misc.conf
source = $end4/hyprland/rules.conf
source = $end4/hyprland/keybinds.conf
