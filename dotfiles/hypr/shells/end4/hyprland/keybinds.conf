# --- Shell keybinds (end-4 illogical-impulse global shortcuts) ---
# DO NOT REMOVE the two lines below: `catchall` (the launcher-interrupt bind)
# only works inside a submap, so ALL binds in this file live in a permanently
# active "global" submap, re-entered on every (re)load via the exec line
# (`exec =` re-fires on hyprctl reload, unlike exec-once). switch-shell.sh
# resets the submap when switching away from end4.
exec = hyprctl dispatch submap global
submap = global

# Tap Super ALONE = search/launcher (upstream wiring, copied verbatim from
# end-4's pre-lua keybinds.conf): the PRESS bind (bindid) arms the toggle
# (GlobalShortcut.onPressed) and its release fires it; the catchall/mouse/Ctrl
# binds fire searchToggleReleaseInterrupt on ANY other key or click while
# Super is down, cancelling the release toggle (needed because quickshell's
# onReleased fires even if other keys were pressed while Super was held).
bindid = Super, Super_L, Toggle search, global, quickshell:searchToggleRelease
bind = Super, Super_L, exec, qs -c ii ipc call TEST_ALIVE || pkill fuzzel || fuzzel # launcher fallback if shell died
binditn = Super, catchall, global, quickshell:searchToggleReleaseInterrupt
bind = Ctrl, Super_L, global, quickshell:searchToggleReleaseInterrupt
bind = Super, mouse:272, global, quickshell:searchToggleReleaseInterrupt
bind = Super, mouse:273, global, quickshell:searchToggleReleaseInterrupt
bind = Super, mouse_up, global, quickshell:searchToggleReleaseInterrupt
bind = Super, mouse_down, global, quickshell:searchToggleReleaseInterrupt
# Hold Super = show workspace numbers on the bar
bindit = ,Super_L, global, quickshell:workspaceNumber
bind = SUPER, D, exec, qs -c ii ipc call search toggle
bind = SUPER, I, exec, qs -p ~/.config/quickshell/ii/settings.qml
bind = SUPER, V, global, quickshell:overviewClipboardToggle
bind = SUPER, Period, global, quickshell:overviewEmojiToggle
bind = SUPER, A, global, quickshell:sidebarLeftToggle
bind = SUPER ALT, A, global, quickshell:sidebarLeftToggleDetach
bind = SUPER, N, global, quickshell:sidebarRightToggle
bind = SUPER, Slash, global, quickshell:cheatsheetToggle
bind = SUPER, K, global, quickshell:oskToggle
bind = SUPER, M, global, quickshell:mediaControlsToggle
bind = SUPER, G, global, quickshell:overlayToggle
bind = CTRL ALT, Delete, global, quickshell:sessionToggle
bind = SUPER, J, global, quickshell:barToggle
bind = CTRL SUPER, T, global, quickshell:wallpaperSelectorToggle
bind = CTRL SUPER ALT, T, global, quickshell:wallpaperSelectorRandom
bind = CTRL SUPER SHIFT, D, global, quickshell:toggleLightDark
bind = CTRL SUPER, P, global, quickshell:panelFamilyCycle
bind = CTRL SUPER, R, exec, killall ydotool qs quickshell; qs -c ii &
bind = SUPER SHIFT, S, global, quickshell:regionScreenshot
bind = SUPER SHIFT, A, global, quickshell:regionSearch
bind = SUPER SHIFT, X, global, quickshell:regionOcr
bind = SUPER SHIFT, T, global, quickshell:screenTranslate
bind = SUPER SHIFT, R, global, quickshell:regionRecord

# --- Core WM binds ---
bind = Super, Q, killactive
bind = Super, F, fullscreen
bind = Super+Alt, F, togglefloating

bind = Super, left, movefocus, l
bind = Super, right, movefocus, r
bind = Super, up, movefocus, u
bind = Super, down, movefocus, d

bind = Super+Shift, left, movewindow, l
bind = Super+Shift, right, movewindow, r
bind = Super+Shift, up, movewindow, u
bind = Super+Shift, down, movewindow, d

bind = Super+Alt, period, layoutmsg, move +col
bind = Super+Alt, comma, layoutmsg, move -col
bind = Super+Shift, period, layoutmsg, colresize +conf
bind = Super+Shift, comma, layoutmsg, colresize -conf

bind = Super, 1, workspace, 1
bind = Super, 2, workspace, 2
bind = Super, 3, workspace, 3
bind = Super, 4, workspace, 4
bind = Super, 5, workspace, 5
bind = Super+Alt, 1, movetoworkspace, 1
bind = Super+Alt, 2, movetoworkspace, 2
bind = Super+Alt, 3, movetoworkspace, 3
bind = Super+Alt, 4, movetoworkspace, 4
bind = Super+Alt, 5, movetoworkspace, 5
bind = Super, tab, workspace, m+1
bind = Super+Shift, tab, workspace, m-1
bind = Super, z, workspace, -1
bind = Super, x, workspace, +1

bindm = Super, mouse:272, movewindow
bindm = Super, mouse:273, resizewindow

# --- Media / hardware keys ---
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- Apps ---
bind = Super, e, exec, thunar
bind = Super, w, exec, zen-browser
bind = Super, r, exec, $fileExplorer
bind = Super, b, exec, $browser
bind = Super, return, exec, $terminal
bind = Super+Alt, k, exec, kitty
bind = Ctrl+Alt, b, exec, blueman-manager
bind = Super, Backslash, exec, hyprsunset -t 4500
bind = Super+Shift, Backslash, exec, pkill hyprsunset

# --- Shell switcher ---
bind = Super+Shift, o, exec, ~/.config/dcli/scripts/switch-shell.sh
