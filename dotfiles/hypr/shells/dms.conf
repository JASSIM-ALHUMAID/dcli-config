# DankMaterialShell — no hyprland config of its own, so reuse caelestia's
# base (env, input, animations, monitors, and my hypr-user.conf app binds).
# Caelestia-IPC keybinds in that base are harmless no-ops while caelestia
# isn't running.
source = ~/.local/share/caelestia/hypr/hyprland.conf

# DMS itself
exec-once = dms run

# DMS equivalents for the shell-IPC binds that go dead without caelestia
bind = Super, Space, exec, dms ipc call spotlight toggle
bind = Super, N, exec, dms ipc call notifications toggle
bind = Super+Alt, L, exec, dms ipc call lock lock
