[mgr]
show_hidden = true
show_symlink= true
linemode = "size_and_mtime"
ratio = [1, 4, 4]  # default: 1/8 parent, 4/8 current, 3/8 preview
sort_by= "alphabetical"
sort_reverse = false

[preview]
max_width  = 1200   # or larger
max_height = 1920   # or larger

[opener]
wordcraft = [
  { run = '"/home/awhss/Applications/wordcraft-0.15.2-linux-x86_64.AppImage" %s1', desc = "WordCraft", orphan = true },
]

[open]
prepend_rules = [
  { url = "*.docx", use = "wordcraft" },
]

