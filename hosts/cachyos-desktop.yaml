host: cachyos-desktop
description: CachyOS Hyprland Desktop with Caelestia Shell
import: []
enabled_modules:
- base
- hyprland-entry
- caelestia
- ambxst
- shell-fish
- terminal-wezterm
- editor-neovim
- editor-ide
- file-manager
- browsers
- media
- dev-tools
- system-utils
packages: []
exclude: []
additional_packages: []
flatpak_scope: user
auto_prune: false
module_processing: parallel
strict_package_order: false
config_backups:
  enabled: true
  max_backups: 5
system_backups:
  enabled: true
  backup_on_sync: true
  backup_on_update: true
  tool: snapper
  snapper_config: root
  max_backups: 5
services:
  enabled:
  - NetworkManager
  - NetworkManager-dispatcher
  - NetworkManager-wait-online
  - ananicy-cpp
  - avahi-daemon
  - bluetooth
  - getty@
  - rustdesk
  - tailscaled
  - ufw
  disabled: []
  scope: system
enabled_service_profiles: []
update_hooks:
  pre_update: null
  post_update: null
  behavior: ask
  devel: false
  run_as_user: false
default_apps:
  scope: system
  browser: zen
  text_editor: nvim
  file_manager: thunar
  terminal: org.wezfurlong.wezterm
  video_player: vlc
  audio_player: mpv
  image_viewer: null
  pdf_viewer: brave-browser-nightly
  mime_types: {}
theming:
  scope: user
  cursor: null
  icons: null
  theme: null
  dark_or_light: null
  font: null
  gtk: null
  qt: null
  env_vars: {}
editor: null
package_manager: null
aur_helper: paru
sync_sudo: false
auto_commit: false
nix:
  enabled: false
  home_manager_enabled: false
  nix_profile_enabled: false
  flake_enabled: false
  nixpkgs_channel: nixpkgs-unstable
  home_manager_channel: release-25.05
