description: ryoku (Ryoku-dev/ryoku) - the distro's Quickshell desktop, run from a checkout

# Runtime deps from ryoku-shell's PKGBUILD and ryoku/shell/README.md. Declared
# here (not in the hook) so every sync re-checks them. Already provided by
# enabled base/terminal modules and therefore not repeated: wayland, jq, python,
# brightnessctl, wtype, wl-clipboard/wl-clip-persist, power-profiles-daemon,
# networkmanager, curl, libnotify, pipewire/wireplumber, playerctl, cava,
# imagemagick, hyprpicker, hypridle, hyprsunset, tesseract, zbar, mpv,
# gpu-screen-recorder, cliphist.
#
# Some runtime deps below are also in end4/caelestia modules; they are repeated
# on purpose so disabling another shell cannot break this one.
packages:
  # build toolchain (the hook compiles ryoku-shell, ryogami, the Hub/store
  # backends and the Qt plugins)
  - go
  - cmake
  - ninja
  - qt6-shadertools
  - qt6-quick3d
  - vulkan-headers         # ryogami picker's GPU card list
  - wayland-protocols      # ryogami-live (video wallpapers)
  # ryogami (wallpaper daemon + picker), from its PKGBUILD
  - qt6-multimedia         # picker video previews
  - qt6-imageformats       # WebP/AVIF thumbnails and RyoStore art
  # ryoku-desktop's hard depends the shell QML imports or calls by name
  - syntax-highlighting    # code blocks in the Super+S chat (QML import)
  - libqalculate           # launcher calculator
  - inter-font             # the shell UI font
  - mpv-mpris              # launcher radio on the players bus
  - yt-dlp                 # radio stream resolution
  # runtime
  - ffmpeg                 # visualizer, recording, palette generation
  - uv                     # ryostage's pinned Python 3.13 venv
  - socat                  # IPC helpers
  - gum                    # interactive helpers
  - qrencode               # Wi-Fi/contact QR sharing
  - zenity                 # file pickers and dialogs
  - inotify-tools          # config file watchers
  - easyeffects            # equalizer backend
  - lsp-plugins-lv2
  - calf
  - ddcutil                # brightness on external monitors
  - upower                 # battery state
  - hyprlock              # SUPER + L (ryoku's qylock is not installed)

# Do NOT declare quickshell/quickshell-git here: the provider has exactly one
# owner, modules/shells-quickshell{,-git}.yaml (docs/PACKAGE-CONFLICTS.md).
# ryoku is a Quickshell desktop and runs on whichever provider is enabled.
#
# WHAT THIS IS NOT: ryoku is a distribution. Its installer adds a signed
# [ryoku] pacman repo, installs ryoku-desktop-hyprland and converts the system
# in place (SDDM, limine, snapshots); `ryoku materialize` copies its config tree
# into ~/.config, including ~/.config/hypr. None of that is run. This module
# reproduces the user-level half of the distro's packages from their own
# recipes: the checkout is the source, the hook builds the daemons, Hub/store
# backends and QML modules into ~/.local, links the user-level helpers into a
# private bin dir the ryoku session puts on PATH, and links the Quickshell
# configs by name. The Hyprland config is dotfiles/hypr/shells/ryoku/hyprland.lua
# in this repo. Details in docs/shells/ryoku.md.
#
# Not declared (no session feature needs them): skwd-paper-bin (Wallpaper
# Engine scenes, [ryoku] repo only), ryoku-cursors, qylock.
post_install_hook: scripts/setup-ryoku.sh
hook_behavior: once

# No `dotfiles:` key: there is no dcli-owned config directory. ~/.config/ryoku
# (shell.json, widgets.json, desktop.json, ...) is written by the daemon and
# Hub — the sole writers — and stays machine-local; the hook seeds two files
# once. ~/.config/quickshell/{shell,hub,ryostore,...} are hook-made symlinks
# into the checkout, not dcli dotfiles.
#
# Launched as `ryogami` + `ryoku-shell daemon` with ~/.local/lib/ryoku/bin on
# PATH (deployed mode, no RYOKU_SHELL_DIR); the daemon supervises the
# `qs -c shell` desktop. Switch with scripts/switch-shell.sh ryoku.
