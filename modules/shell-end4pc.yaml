description: end4-pC (pctrade's end-4 dots-hyprland fork) - alternate shell (quickshell config "end4-pC")

packages: []

# Do NOT declare the illogical-impulse-quickshell-git package: it is a FOURTH
# mutually-exclusive quickshell provider and would fight the one owned by
# modules/shells-quickshell{,-git}.yaml. The end4-pC config runs fine on either
# of those; this hook installs the fork's extra deps as regular packages
# instead. See docs/PACKAGE-CONFLICTS.md.
post_install_hook: scripts/setup-end4pc.sh
hook_behavior: once

# ~/.config/quickshell/end4-pC is deliberately NOT listed here: it is a symlink
# into the ~/.local/share/end4-pC checkout (source of truth) and a dcli dotfiles
# sync must not replace it.
#
# matugen-end4pc is end4pc's own copy of the illogical-impulse matugen config.
# Upstream expects ~/.config/matugen, which on this machine is a symlink into
# the ii checkout (~/.local/share/dots-hyprland) — so end4pc used to die with
# shell-end4. scripts/patch-end4pc.sh rewrites switchwall.sh to use this copy
# instead, and its hyprland template writes to shells/end4pc/colors.lua.
dotfiles:
  - source: matugen-end4pc
    target: ~/.config/matugen-end4pc

# Launched per-session via ~/.config/hypr/shells/end4pc/hyprland.lua; switch
# with scripts/switch-shell.sh end4pc.
#
# That file loads shells/end4pc/{colors,monitors,overrides/*}.lua last — those
# are written by matugen and by the shell's own settings app (SUPER + I), which
# scripts/patch-end4pc.sh repoints at them. Shell config lives in
# ~/.config/illogical-impulse-pC, not the ii shell's ~/.config/illogical-impulse.
# Only ~/.local/state/quickshell/user and the secret-tool keyring entry are
# still shared with shell-end4; neither is needed for end4pc to run.
