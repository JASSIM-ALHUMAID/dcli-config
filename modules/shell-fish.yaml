description: Fish shell with Starship prompt

packages:
  - fish
  - fish-autopair
  - fisher
  - fish-pure-prompt
  - starship
  - zoxide

# ~/.config/fish is dcli's own (dotfiles/fish), no longer a symlink into the
# caelestia-dots checkout: the greeting must follow whichever shell is active,
# and the main shell's checkout is not the place to keep that. config.fish still
# reads caelestia's sequences.txt and user-config.fish when they exist.
# fish_variables is machine state and git-ignored. As always, the real linking is
# done by scripts/link-dotfiles.sh; this key is documentation.
dotfiles:
  - source: fish
    target: ~/.config/fish
