description: WezTerm terminal emulator + my config (mirror of JASSIM-ALHUMAID/wezterm)

packages:
  - wezterm-nightly-bin

# NOTE: flat YAML modules ignore `dotfiles:` keys (see link-dotfiles.sh) —
# the key below is documentation only. The hook does the real work: it
# clones JASSIM-ALHUMAID/wezterm to ~/.config/wezterm (source of truth),
# falling back to the dotfiles/wezterm snapshot if the clone fails.
dotfiles:
  - source: wezterm
    target: ~/.config/wezterm

post_install_hook: scripts/setup-wezterm.sh
hook_behavior: once
