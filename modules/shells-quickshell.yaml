description: Stock quickshell provider - released quickshell from the repos

packages:
  - quickshell

# Exactly one quickshell provider may be installed: quickshell-git has
# Conflicts=quickshell. Enable this one to pin the released build.
#
# Stock quickshell is now 0.3.2 in extra. The shells that only need plain
# `quickshell` run fine here: shell-dms (dux-shell), ambxst, shell-end4,
# shell-end4pc, shell-omarchy and shell-xenon.
#
# The caelestia fork's own README asks for quickshell-git; whether stock 0.3.2
# works for it is being tested, so caelestia is not declared incompatible;
# scripts/switch-quickshell.sh only warns and asks for confirmation.
#
# Install the git build as `aur/quickshell-git`, never by bare name:
# `pacman -Sp quickshell-git` still resolves to the repo package noctalia-qs.
#
# dcli's `conflicts:` only prompts at `dcli module enable` time and never
# uninstalls the outgoing provider (auto_prune is false, and dcli installs with
# `pacman -S --noconfirm`, which cannot answer pacman's conflict prompt). Use
# scripts/switch-quickshell.sh — it does the swap as one interactive pacman
# transaction, then reconciles with dcli sync.
conflicts:
  - shells-quickshell-git
