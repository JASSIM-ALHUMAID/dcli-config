description: xenon-shell (MannuVilasara/xenon-shell) - alternate shell (quickshell config "xenon")

packages:
  - python
  - imagemagick
  - brightnessctl
  - cliphist
  - wl-clipboard
  - ttf-jetbrains-mono-nerd
  - ttf-nerd-fonts-symbols
  - papirus-icon-theme

# Do NOT declare quickshell/quickshell-git here: the provider has exactly one
# owner, modules/shells-quickshell{,-git}.yaml, and a second module claiming it
# is the conflict trap in docs/PACKAGE-CONFLICTS.md. xenon is a plain Quickshell
# config and runs on whichever provider is enabled. Only its own runtime deps
# (upstream README + what the QML execs) are declared, re-checked every sync.
#
# openrgb is deliberately NOT installed: it is only used when the openRgbDevices
# key is set in ~/.config/xenon/config.json, and it is hardware-specific. See
# docs/shells/xenon.md.
#
# There is no upstream installer to skip — xenon's README is a git clone plus a
# dependency list, nothing more.
post_install_hook: scripts/setup-xenon.sh
hook_behavior: once

# ~/.config/quickshell/xenon is deliberately NOT listed here: it is a symlink
# into the ~/.local/share/xenon-shell checkout (source of truth, cloned straight
# from upstream — no personal fork) and a dcli dotfiles sync must not replace it.
#
# /etc/xdg/quickshell/xenon is a leftover root-owned clone owned by no package.
# It is left in place on purpose: quickshell prefers XDG_CONFIG_HOME, so the
# user copy above shadows it. Nothing here touches /etc.
#
# ~/.config/xenon holds config.json only (fonts, bar layout, wallpaper dir,
# lock-screen toggles) — small and hand-editable, so it IS tracked. Generated
# data (colors, wallpaper thumbnails, app-usage) lives in ~/.cache/xenon and is
# machine-local. As always, the real linking is done by scripts/link-dotfiles.sh;
# this key is documentation.
dotfiles:
  - source: xenon
    target: ~/.config/xenon

# Launched per-session via ~/.config/hypr/shells/xenon/hyprland.lua, which binds
# the shell's `qs -c xenon ipc call <target> <fn>` verbs. Switch with
# scripts/switch-shell.sh xenon.
