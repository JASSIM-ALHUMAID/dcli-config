description: System utilities and monitoring

packages:
  - btop
  - fastfetch
  - fuzzel
  - nvtop
  - glances
  - sniffnet
  - duf
  - tty-clock
  - zoxide
  - plocate
  - reflector
  - snapper
  - btrfs-assistant
  - rebuild-detector
  - downgrade
  - pacman-contrib
  - pkgfile
  - localsend
  - rustdesk
  - tailscale
  - inxi
  - tealdeer
  - eza
  - bat
  - trash-cli

dotfiles:
  - source: fuzzel
    target: ~/.config/fuzzel

# btop is a dcli dotfile, linked by scripts/link-dotfiles.sh. fastfetch is not
# managed here: ~/.config/fastfetch is a symlink into the upstream caelestia-dots
# clone at ~/.local/share/caelestia/fastfetch, created by hand.
