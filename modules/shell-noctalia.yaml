description: Noctalia shell - alternate shell (runs on its own quickshell fork)

packages: []

# Do NOT declare the noctalia-shell package: it depends on noctalia-qs,
# whose Conflicts=quickshell would REMOVE the stock quickshell that
# caelestia and dms need. The hook instead clones the noctalia QML to
# ~/.config/quickshell/noctalia-shell and extracts the noctalia-qs fork
# (unpackaged) to ~/.local/opt/noctalia-qs with a ~/.local/bin/noctalia
# launcher wrapper.
post_install_hook: scripts/setup-noctalia.sh
hook_behavior: once
run_hooks_as_user: true

dotfiles:
  - source: noctalia
    target: ~/.config/noctalia

# Launched per-session via ~/.config/hypr/shells/noctalia.conf (`noctalia`).
# Switch with scripts/switch-shell.sh noctalia
