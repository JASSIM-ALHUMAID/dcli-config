description: Core Hyprland compositor and essential desktop tools

# Links ~/.config/<dir> -> dotfiles/<dir> (dcli's YAML modules ignore
# `dotfiles:` keys, so this script is the real dotfiles mechanism).
post_install_hook: scripts/link-dotfiles.sh
hook_behavior: once

packages:
  - hyprland
  - hyprpolkitagent
  - hyprsunset
  - hyprcursor
  - hyprgraphics
  - hyprpicker
  - hyprutils
  - hyprwayland-scanner
  - hyprwire
  - xdg-desktop-portal-hyprland
  - xdg-desktop-portal-gtk
  - xdg-user-dirs
  - xorg-xwayland
  - wofi
  - wl-clipboard
  - wl-clip-persist
  - wlsunset
  - wtype
  - grim
  - slurp
  - swappy
  - cliphist
  - playerctl
  - brightnessctl
  - pipewire
  - pipewire-alsa
  - pipewire-pulse
  - pipewire-audio
  - wireplumber
  - gst-plugin-pipewire
  - gst-libav
  - gst-plugin-va
  - gst-plugins-bad
  - gst-plugins-ugly
  - gst-plugins-base
  - pavucontrol
  - nwg-look
  - uwsm
  - matugen
  - noto-fonts
  - noto-fonts-cjk
  - noto-fonts-emoji
  - cantarell-fonts
  - ttf-bitstream-vera
  - ttf-dejavu
  - ttf-liberation
  - ttf-opensans
  - ttf-roboto-mono
  - ttf-league-gothic
  - ttf-phosphor-icons
  - awesome-terminal-fonts
  - ttf-meslo-nerd
  - ttf-jetbrains-mono-nerd
  - ttf-cascadia-code-nerd
  - ttf-fantasque-nerd
  - ttf-material-symbols-variable
  - ttf-nerd-fonts-symbols
  - ttf-roboto
  - ttf-rubik-vf
  - powerline-fonts
